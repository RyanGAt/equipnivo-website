server {
    listen 80;
    server_name equipnivo.stackedthink.com;
    root /var/www/equipnivo-website/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location /downloads/ {
        alias /var/www/equipnivo-website/downloads/;
        autoindex off;
        types { application/octet-stream exe; text/plain sha256; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
}

